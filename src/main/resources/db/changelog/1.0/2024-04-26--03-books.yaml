databaseChangeLog:
  - changeSet:
      id: 2024-04-26--01-books
      author: vvolkova
      changes:
        - createTable:
            tableName: books
            columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  nullable: false
                  primaryKey: true
                  primaryKeyName: pk_books
            - column:
                name: name
                type: varchar(255)
            - column:
                name: description
                type: varchar(255)
            - column:
                name: authorId
                type: bigint
                constraints:
                  nullable: false
                  foreignKeyName: fk_authors
                  references: authors(id)
            - column:
                name: genreId
                type: bigint
                constraints:
                  nullable: false
                  foreignKeyName: fk_genres
                  references: genres(id)