databaseChangeLog:
  - changeSet:
      id: 2024-04-26--01-genres
      author: vvolkova
      changes:
        - createTable:
            tableName: genres
            columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
